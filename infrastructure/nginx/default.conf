server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    # API du service patrimoine -> asset-service
    # Regex directe vers php-fpm avec SCRIPT_FILENAME fixe : pas de
    # redirection interne (try_files), ce qui préserve le corps de la
    # requête et évite que le fallback /index.php ne retombe sur
    # l'auth-service.
    location ~ ^/api/v1/(health|assets|asset-categories|asset-locations|asset-history|asset-submissions|assignments|transfers|maintenances|incidents|documents|inventories|inventory-items|reports|notifications)(/|$) {
        fastcgi_pass asset-service:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # Chemin vu de l'intérieur du conteneur asset-service
        fastcgi_param SCRIPT_FILENAME
            /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass auth-service:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_HOST $http_host;
    }

    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_connect_timeout 60;

    location ~ /\.ht {
        deny all;
    }
}
