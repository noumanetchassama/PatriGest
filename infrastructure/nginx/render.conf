server {
    listen 10000;
    server_name _;

    root /var/www/auth/public;
    index index.php index.html;

    client_max_body_size 20M;

    # API du service patrimoine
    location ~ ^/api/v1/(health|assets|asset-categories|asset-locations|asset-history|asset-submissions|assignments|transfers|maintenances|incidents|documents|inventories|inventory-items|reports)(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9002;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/asset/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/asset/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Application principale
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Auth Service
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;

       include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_PORT $server_port;

        fastcgi_param SCRIPT_FILENAME /var/www/auth/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/auth/public;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.ht {
        deny all;
    }

    fastcgi_read_timeout 120;
}
