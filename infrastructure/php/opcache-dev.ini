; Optimisation OPcache pour le dev sur montures bind Docker Desktop.
; validate_timestamps=0 : PHP ne re-stat JAMAIS les fichiers (le stat()
; coûte ~10 ms via le partage de fichiers Windows -> des milliers par
; requête sinon). Les modifications de code sont prises en compte après
; un reload php-fpm :
;   docker exec patri-auth-service kill -USR2 1
;   docker exec patri-asset-service kill -USR2 1

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Cache des chemins réels (realpath) — Laravel en fait des milliers
realpath_cache_size=4096K
realpath_cache_ttl=300
