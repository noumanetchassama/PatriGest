<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, Roboto, Arial, sans-serif" role="img" aria-label="PatriGest — Connexion" xmlns:c2pa="http://c2pa.org/manifest"><title>PatriGest — Connexion</title><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#17324D" flood-opacity="0.10"/></filter></defs><rect x="0" y="0" width="1280" height="800" rx="0" fill="#F4F7FA"/><rect x="0" y="0" width="640" height="800" rx="0" fill="#17324D"/><text x="64" y="80" font-size="24" fill="#fff" font-weight="700" text-anchor="start">PatriGest</text><text x="64" y="360" font-size="38" fill="#fff" font-weight="700" text-anchor="start">Gestion du patrimoine public</text><text x="64" y="402" font-size="16" fill="#EAF2F8" font-weight="400" text-anchor="start">Recenser, affecter, suivre et protéger les biens</text><text x="64" y="426" font-size="16" fill="#EAF2F8" font-weight="400" text-anchor="start">immobiliers, mobiliers et les véhicules.</text><text x="64" y="740" font-size="13" fill="#EAF2F8" font-weight="400" text-anchor="start">Ministère des Finances et du Budget — République togolaise</text><rect x="720" y="150" width="440" height="500" rx="12" fill="#fff" filter="url(#sh)"/><text x="752" y="206" font-size="24" fill="#17324D" font-weight="700" text-anchor="start">Connexion</text><text x="752" y="232" font-size="13" fill="#4A5560" font-weight="400" text-anchor="start">Connectez-vous pour accéder à votre espace de gestion.</text><text x="752" y="262" font-size="13" fill="#202830" font-weight="600" text-anchor="start">Adresse e-mail ou identifiant</text><rect x="752" y="270" width="376" height="44" rx="8" fill="#fff" stroke="#C9D3DC"/><text x="764" y="298" font-size="14" fill="#202830" font-weight="400" text-anchor="start">a.koffi@mfb.exemple.tg</text><text x="752" y="340" font-size="13" fill="#202830" font-weight="600" text-anchor="start">Mot de passe</text><rect x="752" y="348" width="376" height="44" rx="8" fill="#fff" stroke="#C9D3DC"/><text x="764" y="376" font-size="14" fill="#202830" font-weight="400" text-anchor="start">••••••••••</text><rect x="752" y="430" width="16" height="16" rx="3" fill="#fff" stroke="#8A96A3"/><text x="776" y="443" font-size="13" fill="#202830" font-weight="400" text-anchor="start">Se souvenir de moi</text><text x="1128" y="443" font-size="13" fill="#245B83" font-weight="500" text-anchor="end">Mot de passe oublié ?</text><rect x="752" y="470" width="376" height="42" rx="8" fill="#245B83"/><text x="940.0" y="496" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Se connecter</text><text x="752" y="540" font-size="12" fill="#4A5560" font-weight="400" text-anchor="start">Accès réservé aux agents habilités.</text><text x="752" y="558" font-size="12" fill="#4A5560" font-weight="400" text-anchor="start">Vos actions sont enregistrées et tracées.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
